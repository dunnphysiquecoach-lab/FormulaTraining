<style>
/* Layout: single column phone app, sticky top bar, fixed bottom tab bar. Committed dark look so the white logo always reads. */
:root{
  --bg:#0B0F12; --surface:#131A1F; --surface-2:#1A232A; --line:#24323B;
  --fg:#EAF4F5; --muted:#8C9DA5; --cyan:#5BDFE4; --pink:#FF00C7;
  --good:#5BE49B; --amber:#FFB547; --cyan-ink:#06272A;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar img{height:26px;width:auto}
.week-pill{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--cyan);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.section{padding-top:24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:15px;min-height:48px;text-decoration:none}
.btn-primary{background:var(--cyan);color:var(--cyan-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn-pink{background:var(--pink);color:#fff}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;width:100%;min-width:0}
.input:focus{border-color:var(--cyan);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Gate & onboarding */
.hero{padding-top:40px;display:flex;flex-direction:column;gap:20px}
.hero img{width:min(320px,80%);height:auto}
.prog-option{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;width:100%}
.prog-option[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.prog-option:disabled{opacity:.55;cursor:not-allowed}
.split{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
.chip.lift{color:var(--cyan)}
.chip.hyrox{color:var(--pink)}
.chip.run{color:var(--good)}
.chip.hiit{color:var(--amber)}
.soon{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pink)}

/* Today */
.next{background:linear-gradient(160deg,color-mix(in srgb,var(--cyan) 16%,var(--surface)) 0%,var(--surface) 60%);border:1px solid color-mix(in srgb,var(--cyan) 35%,var(--line))}
.next h2{font-size:30px}
.dots{display:flex;gap:6px}
.dot{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.dot.on{background:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.stat span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.invite{border-color:color-mix(in srgb,var(--pink) 45%,var(--line))}
.invite .eyebrow{color:var(--pink)}

/* Session */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ex-title{font-weight:700;font-size:16px}
.ex-meta{font-size:13px;color:var(--cyan);font-weight:600;white-space:nowrap}
.ex-note{font-size:13px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set.one{grid-template-columns:28px 1fr 48px}
.set-n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:17px}
.set .input{padding:10px;text-align:center}
.tick{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink)}
.tick svg{width:20px;height:20px}
.set-head{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.set-head.one{grid-template-columns:28px 1fr 48px}
.stations{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stations li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stations li:last-child{border-bottom:0}
.stations small{color:var(--muted);display:block;font-size:12px}
.rounds{display:flex;flex-wrap:wrap;gap:8px}
.round{min-width:56px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.round[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.blocks{display:flex;flex-direction:column;gap:8px}
.block{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.block b{font-family:var(--display);font-size:18px;color:var(--good)}
textarea.input{min-height:84px;resize:vertical}
.sticky-finish{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sticky-finish .inner{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;display:flex;gap:10px}
.sticky-finish .btn{flex:1}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--cyan)}

/* Program view */
.day{display:flex;flex-direction:column;gap:8px}
.day ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.day ol li::marker{color:var(--muted)}
.day .done-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--good)}

/* Progress */
.chart-wrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.hist li:last-child{border-bottom:0}
.hist .when{font-size:12px;color:var(--muted);white-space:nowrap}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.inline-form{display:flex;gap:8px}
.inline-form .input{flex:1}

/* Confirm sheet + toast */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .actions{display:flex;gap:10px}
.sheet .actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.error{color:var(--pink);font-size:13px;font-weight:500}
@media (prefers-reduced-motion:no-preference){.card,.ex,.prog-option{transition:border-color .15s}.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}}
@media (max-width:360px){h1{font-size:28px}.stat b{font-size:22px}}

const KEY = "the-formula-app-v1";

/* ---------------- Helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const prog = () => PROGRAMS.find(p=>p.id===S.programId);
const sess = (p,i) => SESSIONS[p.days[i]];
const progLabel = p => `${p.name} · ${STYLE_LABEL[p.style]}`;
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"});
const myLog = () => S.log.filter(l=>l.programId===S.programId);
function weekIndex(){ return Math.min(Math.floor(myLog().length / prog().days.length), WEEKS-1); }
function isComplete(){ return myLog().length >= prog().days.length*WEEKS; }
function nextDay(){ return myLog().length % prog().days.length; }
function doneThisWeek(){ return myLog().length % prog().days.length; }
function latestWeight(){ return S.weights.length ? S.weights[S.weights.length-1].kg : (S.profile?.startWeight ?? null); }

function lastSet(sessKey, exIdx, setIdx){
  const past = S.log.filter(l=>l.sessKey===sessKey).reverse();
  for(const l of past){ const s = l.data?.sets?.[exIdx]?.[setIdx]; if(s && (s.kg||s.reps)) return s; }
  return null;
}

function confirmSheet(title, body, yes, onYes){
  const bg=document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="actions"><button class="btn btn-ghost" data-no>Cancel</button><button class="btn btn-pink" data-yes>${esc(yes)}</button></div></div>`;
  bg.addEventListener("click",e=>{ if(e.target===bg||e.target.hasAttribute("data-no")) bg.remove(); if(e.target.hasAttribute("data-yes")){ bg.remove(); onYes(); }});
  document.body.appendChild(bg); $("[data-no]",bg).focus();
}

/* ---------------- Routing ---------------- */
let view = "today";
function render(){
  if(!S.unlocked) return renderGate();
  if(!S.profile || !prog()) return renderSetup();
  if(view==="session") return renderSession();
  if(view==="program") return renderProgram();
  if(view==="progress") return renderProgress();
  return renderToday();
}
function shell(inner, opts={}){
  const p = prog();
  const wk = p && S.profile ? (isComplete() ? "Complete" : `Week ${weekIndex()+1} of ${WEEKS}`) : "";
  $("#app").innerHTML = `
    <header class="topbar"><div class="inner"><img src="${LOGO}" alt="The Formula">${wk&&!opts.noWeek?`<span class="week-pill">${wk}</span>`:""}</div></header>
    <main class="wrap">${inner}</main>
    ${opts.noTabs ? "" : tabsHtml()}`;
  window.scrollTo(0,0);
}
function tabsHtml(){
  const t = (id,label,icon)=>`<button class="tab" data-tab="${id}" ${view===id?'aria-current="page"':''}>${icon}${label}</button>`;
  return `<nav class="tabs" aria-label="Main"><div class="inner">
    ${t("today","Today",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>')}
    ${t("program","Program",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>')}
    ${t("progress","Progress",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/></svg>')}
  </div></nav>`;
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ view=b.dataset.tab; render(); }});

/* ---------------- Gate ---------------- */
function tryCode(code){
  const c = String(code||"").trim().toLowerCase();
  if(ACCESS_CODES.map(x=>x.toLowerCase()).includes(c)){ S.unlocked=true; save(); return true; }
  return false;
}
function renderGate(){
  shell(`<section class="hero">
    <img src="${LOGO}" alt="The Formula">
    <h1>Lose the fat. Keep the muscle.</h1>
    <p class="muted">Enter the access code from your purchase confirmation. You only need to do this once on this phone.</p>
    <form id="gate" class="stack" novalidate>
      <label class="field" for="code">Access code<input class="input" id="code" autocomplete="off" autocapitalize="off" placeholder="Your access code"></label>
      <p class="error" id="gate-err" hidden>That code didn't work. Check your confirmation message, or DM me "Formula" on Instagram and I'll sort it.</p>
      <button class="btn btn-primary btn-block" type="submit">Unlock</button>
    </form>
  </section>`, {noTabs:true});
  $("#gate").addEventListener("submit",e=>{ e.preventDefault(); if(tryCode($("#code").value)) render(); else $("#gate-err").hidden=false; });
}

/* ---------------- Setup ---------------- */
function renderSetup(){
  let chosen = prog() ? S.programId : "hyrox4";
  const option = p => `
    <button type="button" class="prog-option" data-prog="${p.id}" aria-pressed="${p.id===chosen}">
      <h3>${esc(p.name)}</h3>
      <span class="muted" style="font-size:14px">${esc(p.who)}</span>
      <span class="split">${p.days.map(k=>`<span class="chip ${chipClass(SESSIONS[k])}">${esc(SESSIONS[k].name)}</span>`).join("")}</span>
    </button>`;
  const group = (style, title, blurb) => `<div class="stack-sm"><p class="eyebrow">${title}</p><p class="muted" style="font-size:13px">${blurb}</p>${PROGRAMS.filter(p=>p.style===style).map(option).join("")}</div>`;
  shell(`<section class="hero" style="padding-top:28px">
    <p class="eyebrow">Set up</p>
    <h1>Let's get you started</h1>
    <form id="setup" class="stack" novalidate>
      <label class="field" for="name">First name<input class="input" id="name" autocomplete="given-name" value="${esc(S.profile?.name||"")}"></label>
      <div class="row2">
        <label class="field" for="sw">Current weight (kg)<input class="input" id="sw" inputmode="decimal" value="${esc(S.profile?.startWeight||"")}"></label>
        <label class="field" for="gw">Goal weight (kg)<input class="input" id="gw" inputmode="decimal" value="${esc(S.profile?.goalWeight||"")}"></label>
      </div>
      ${group("hyrox","Hyrox programs","Conditioning days use Hyrox stations: SkiErg, sled, wall balls, runs.")}
      ${group("hiit","HIIT programs","Same structure, with HIIT circuits you can do with dumbbells and a kettlebell.")}
      <p class="error" id="setup-err" hidden>Add your name and current weight so we can track your progress.</p>
      <button class="btn btn-primary btn-block" type="submit">Start training</button>
    </form>
  </section>`, {noTabs:true, noWeek:true});
  document.querySelectorAll("[data-prog]").forEach(b=>b.addEventListener("click",()=>{
    chosen=b.dataset.prog; document.querySelectorAll("[data-prog]").forEach(x=>x.setAttribute("aria-pressed", x===b));
  }));
  $("#setup").addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("#name").value.trim(), sw=parseFloat($("#sw").value), gw=parseFloat($("#gw").value);
    if(!name || !sw){ $("#setup-err").hidden=false; return; }
    S.profile={name, startWeight:sw, goalWeight:gw||null, startDate:S.profile?.startDate||today()};
    S.programId=chosen; S.draft=null;
    if(!S.weights.length) S.weights.push({date:today(), kg:sw});
    save(); view="today"; render();
  });
}

/* ---------------- Today ---------------- */
function renderToday(){
  const p=prog(), wi=weekIndex(), nd=nextDay(), s=sess(p,nd), n=p.days.length;
  const done=doneThisWeek(), lw=latestWeight(), lost = S.profile.startWeight && lw ? (S.profile.startWeight - lw) : 0;
  const draftOn = S.draft && S.draft.programId===p.id && S.draft.dayIdx===nd;
  const complete = isComplete();
  const hero = complete ? `
    <div class="card next"><p class="eyebrow">Program complete</p><h2>${WEEKS} weeks done</h2>
      <p class="muted">That's ${myLog().length} sessions logged. Most people never finish a program. You did.</p></div>` : `
    <div class="card next">
      <p class="eyebrow">Next session · Day ${nd+1} of ${n}</p>
      <h2>${esc(s.name)}</h2>
      <p class="muted">${esc(s.time)} · ${sessionSummary(s, wi)}</p>
      ${wi===WEEKS-1?'<p style="font-size:14px">Deload week. Lighter on purpose so you recover and come back stronger.</p>':""}
      <button class="btn btn-primary btn-block" id="start">${draftOn?"Continue session":"Start session"}</button>
    </div>`;
  shell(`
    <section class="section">
      <p class="eyebrow">${greeting()}, ${esc(S.profile.name)}</p>
      ${hero}
      <div class="stack-sm"><div style="display:flex;justify-content:space-between" class="eyebrow"><span>This week</span><span>${done} of ${n} done</span></div>
        <div class="dots">${Array.from({length:n},(_,i)=>`<span class="dot ${i<done?"on":""}"></span>`).join("")}</div></div>
      <div class="stats">
        <div class="stat"><b>${myLog().length}</b><span>Sessions</span></div>
        <div class="stat"><b>${lw!=null?lw:"–"}</b><span>Weight kg</span></div>
        <div class="stat"><b>${lost>0?"−"+(Math.round(lost*10)/10):"0"}</b><span>Kg down</span></div>
      </div>
    </section>
    <section class="section">${inviteCard(wi, complete)}</section>
    <section class="section"><p class="muted" style="font-size:13px">On: ${esc(progLabel(p))}</p><button class="btn btn-ghost btn-block" id="switch">Change program or profile</button></section>
  `);
  $("#start")?.addEventListener("click",()=>{ view="session"; render(); });
  $("#switch").addEventListener("click",()=>{ S.programId=null; save(); render(); });
}
function greeting(){ const h=new Date().getHours(); return h<12?"Morning":h<17?"Afternoon":"Evening"; }
function sessionSummary(s, wi){
  if(s.type==="lift") return `${s.exercises.length} exercises`;
  if(s.type==="circuit") return `${CIRCUIT_ROUNDS[wi]} rounds`;
  return s.kind==="long" ? `${LONG_RUN_MIN[wi]} min easy` : `${INTERVAL_REPS[wi]} x 400m`;
}
function inviteCard(wi, complete){
  const early = wi<2 && !complete;
  return `<div class="card invite">
    <p class="eyebrow">${complete?"What's next":early?"From Scott":"Want more than a program?"}</p>
    <h3>${complete?"Let's build your next 12 weeks together":early?"Log everything. It's how you'll see the change.":"This is how I train my clients. Coaching is where it gets personal."}</h3>
    <p class="muted" style="font-size:14px">${complete
      ?"You've proven you'll show up. With coaching I set your food, adjust your training every week and check in with you, so the next block goes further than this one."
      :early?"Write down your weights and how each session felt. When it gets harder in week 3 or 4, you'll be glad you can look back."
      :"In coaching I adjust this every week based on your check ins, set your nutrition around foods you actually like, and keep you accountable when life gets busy."}</p>
    ${early?"":`<a class="btn btn-pink" href="${INSTAGRAM_DM}" target="_blank" rel="noopener">DM me "Formula" on Instagram</a>`}
  </div>`;
}

/* ---------------- Program view ---------------- */
function runPlan(s, wi){
  return s.kind==="long"
    ? [["5 min","Easy walk or jog to warm up"],[`${LONG_RUN_MIN[wi]} min`,"Easy, conversational pace"],["5 min","Walk to cool down"]]
    : [["10 min","Easy jog to warm up"],[`${INTERVAL_REPS[wi]} x 400m`,"Hard, effort 8 out of 10, with 90 sec easy walk or jog between each"],["10 min","Easy cool down"]];
}
function renderProgram(){
  const p=prog(), wi=weekIndex(), done=doneThisWeek();
  const days = p.days.map((k,i)=>{
    const s=SESSIONS[k]; let list="";
    if(s.type==="lift") list = `<ol>${s.exercises.map(e=>`<li>${esc(e.name)} <span class="muted">${e.sets} x ${esc(e.reps)}</span></li>`).join("")}</ol>`;
    if(s.type==="circuit") list = `<p class="muted" style="font-size:14px">${CIRCUIT_ROUNDS[wi]} rounds. ${esc(s.format)}.</p><ol>${s.stations.map(st=>`<li>${esc(st[0])}</li>`).join("")}</ol>`;
    if(s.type==="run") list = `<ol>${runPlan(s,wi).map(b=>`<li>${esc(b[0])} <span class="muted">${esc(b[1])}</span></li>`).join("")}</ol>`;
    return `<div class="card day"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h3>Day ${i+1} · ${esc(s.name)}</h3>${i<done?'<span class="done-tag">Done</span>':""}</div>${list}</div>`;
  }).join("");
  shell(`<section class="section">
    <p class="eyebrow">${esc(progLabel(p))}</p>
    <h1>Week ${wi+1}</h1>
    <p class="muted">Do the days in order. Leave a rest day after strength days if you can. Miss a day? Pick up where you left off.</p>
    ${days}
    <div class="card"><p class="eyebrow">How it progresses</p>
      <p style="font-size:14px">Strength days: when your sets hit the top of the rep range, add 1.25 to 2.5kg next time. Circuit rounds, run intervals and the long run all build week to week. Week 8 is a deload so your body can catch up.</p></div>
  </section>`);
}

/* ---------------- Session ---------------- */
function getDraft(){
  const p=prog(), nd=nextDay();
  if(!S.draft || S.draft.programId!==p.id || S.draft.dayIdx!==nd) S.draft={programId:p.id, dayIdx:nd, sessKey:p.days[nd], week:weekIndex(), data:{sets:{}, rounds:[], notes:""}};
  return S.draft;
}
function renderSession(){
  const p=prog(), d=getDraft(), s=SESSIONS[d.sessKey], wi=d.week;
  let body="";
  if(s.type==="lift"){
    body = `<p class="muted" style="font-size:13px">Faded numbers are what you did last time. Beat them if you can.</p>` + s.exercises.map((e,ei)=>{
      const rows = Array.from({length:e.sets},(_,si)=>{
        const cur=d.data.sets?.[ei]?.[si]||{}, last=lastSet(d.sessKey,ei,si);
        return `<div class="set"><span class="set-n">${si+1}</span>
          <input class="input" id="s-${ei}-${si}-kg" data-ei="${ei}" data-si="${si}" data-f="kg" inputmode="decimal" placeholder="${last?.kg?esc(last.kg):"kg"}" value="${esc(cur.kg||"")}" aria-label="${esc(e.name)} set ${si+1} kilograms">
          <input class="input" id="s-${ei}-${si}-reps" data-ei="${ei}" data-si="${si}" data-f="reps" inputmode="numeric" placeholder="${last?.reps?esc(last.reps):"reps"}" value="${esc(cur.reps||"")}" aria-label="${esc(e.name)} set ${si+1} reps">
          <button class="tick" data-tick="${ei}-${si}" aria-pressed="${!!cur.done}" aria-label="${esc(e.name)} set ${si+1} done">${tickSvg}</button></div>`;
      }).join("");
      return `<div class="ex"><div class="ex-head"><span class="ex-title">${esc(e.name)}</span><span class="ex-meta">${e.sets} x ${esc(e.reps)}</span></div>
        <p class="ex-note">Rest ${esc(e.rest)}${e.note?" · "+esc(e.note):""}</p>
        <div class="sets"><div class="set-head"><span>Set</span><span>Kg</span><span>Reps</span><span>Done</span></div>${rows}</div></div>`;
    }).join("");
  }
  if(s.type==="circuit"){
    const n=CIRCUIT_ROUNDS[wi];
    body = `<div class="card"><p class="eyebrow">Warm up</p><p style="font-size:14px">${esc(s.warmup)}</p></div>
      <div class="ex"><div class="ex-head"><span class="ex-title">${n} rounds</span></div>
        <p class="ex-note">${esc(s.format)}</p>
        <ul class="stations">${s.stations.map(st=>`<li><span>${esc(st[0])}<small>${esc(st[1])}</small></span></li>`).join("")}</ul></div>
      <div class="ex"><span class="ex-title">Tick off each round</span>
        <div class="rounds">${Array.from({length:n},(_,i)=>`<button class="round" data-round="${i}" aria-pressed="${!!d.data.rounds?.[i]}" aria-label="Round ${i+1}">${i+1}</button>`).join("")}</div>
        <label class="field" for="clog">${esc(s.log)}<input class="input" id="clog" data-meta="time" placeholder="${esc(s.logHint)}" value="${esc(d.data.time||"")}"></label></div>`;
  }
  if(s.type==="run"){
    body = `<div class="ex"><span class="ex-title">${s.kind==="long"?"Easy pace":"Effort 8 out of 10"}</span>
        <div class="blocks">${runPlan(s,wi).map(b=>`<div class="block"><b>${esc(b[0])}</b><span>${esc(b[1])}</span></div>`).join("")}</div></div>
      <div class="ex"><span class="ex-title">Log it</span>
        <div class="row2">
          <label class="field" for="rdist">Total distance (km)<input class="input" id="rdist" data-meta="dist" inputmode="decimal" value="${esc(d.data.dist||"")}"></label>
          <label class="field" for="rtime">Total time (mm:ss)<input class="input" id="rtime" data-meta="time" inputmode="numeric" value="${esc(d.data.time||"")}"></label>
        </div>
        ${s.kind==="interval"?`<label class="field" for="rsplit">Fastest 400m (optional)<input class="input" id="rsplit" data-meta="split" inputmode="numeric" placeholder="e.g. 1:52" value="${esc(d.data.split||"")}"></label>`:""}</div>`;
  }
  shell(`<section class="section">
      <button class="btn btn-ghost" id="back" style="align-self:flex-start;min-height:40px;padding:8px 14px">Back</button>
      <p class="eyebrow">Week ${wi+1} · Day ${d.dayIdx+1} · ${esc(s.time)}</p>
      <h1>${esc(s.name)}</h1>
      <p class="muted">${esc(s.intro)}</p>
      ${body}
      <div class="ex"><label class="field" for="notes">How did it feel? Anything to remember for next time?<textarea class="input" id="notes" data-meta="notes">${esc(d.data.notes||"")}</textarea></label></div>
    </section>
    <div class="sticky-finish"><div class="inner"><button class="btn btn-primary" id="finish">Finish session</button></div></div>`, {noTabs:true});

  $("#back").addEventListener("click",()=>{ save(); view="today"; render(); });
  document.querySelectorAll("[data-f]").forEach(inp=>inp.addEventListener("input",()=>{
    const ei=inp.dataset.ei, si=inp.dataset.si;
    d.data.sets[ei]=d.data.sets[ei]||[]; d.data.sets[ei][si]=d.data.sets[ei][si]||{};
    d.data.sets[ei][si][inp.dataset.f]=inp.value.trim(); save();
  }));
  document.querySelectorAll("[data-tick]").forEach(b=>b.addEventListener("click",()=>{
    const [ei,si]=b.dataset.tick.split("-");
    d.data.sets[ei]=d.data.sets[ei]||[]; d.data.sets[ei][si]=d.data.sets[ei][si]||{};
    const cur=d.data.sets[ei][si];
    if(!cur.kg && !cur.reps){ const last=lastSet(d.sessKey,+ei,+si); if(last){ cur.kg=last.kg||""; cur.reps=last.reps||""; $(`#s-${ei}-${si}-kg`).value=cur.kg; $(`#s-${ei}-${si}-reps`).value=cur.reps; } }
    cur.done=!cur.done; b.setAttribute("aria-pressed",cur.done); save();
  }));
  document.querySelectorAll("[data-round]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.round; d.data.rounds[i]=!d.data.rounds[i]; b.setAttribute("aria-pressed",d.data.rounds[i]); save();
  }));
  document.querySelectorAll("[data-meta]").forEach(inp=>inp.addEventListener("input",()=>{ d.data[inp.dataset.meta]=inp.value; save(); }));
  $("#finish").addEventListener("click",()=>{
    if(!hasAnyData(s,d)) return confirmSheet("Finish without logging?","Nothing's been filled in yet. You can still save it as done.","Save anyway",finish);
    finish();
  });
  function finish(){
    S.log.push({programId:p.id, dayIdx:d.dayIdx, sessKey:d.sessKey, week:wi, date:today(), name:s.name, type:s.type, data:d.data});
    S.draft=null; save(); view="today"; render(); toast("Session saved");
  }
}
function hasAnyData(s,d){
  if(s.type==="lift") return Object.values(d.data.sets||{}).some(a=>(a||[]).some(x=>x&&(x.kg||x.reps||x.done)));
  if(s.type==="circuit") return (d.data.rounds||[]).some(Boolean)||!!d.data.time;
  return !!(d.data.dist||d.data.time);
}

/* ---------------- Progress ---------------- */
function renderProgress(){
  const w=S.weights, hist=S.log.slice().reverse();
  shell(`<section class="section">
      <p class="eyebrow">Progress</p><h1>Bodyweight</h1>
      <div class="card">
        ${w.length>1?chartSvg(w):`<div class="empty">Log your weight once a week, same day, first thing in the morning. Your trend line shows up after the second entry.</div>`}
        <form id="wform" class="inline-form" novalidate>
          <input class="input" id="wkg" inputmode="decimal" placeholder="Today's weight (kg)" aria-label="Weight in kg">
          <button class="btn btn-primary" type="submit">Log</button>
        </form>
        ${S.profile.goalWeight?`<p class="muted" style="font-size:13px">Goal: ${S.profile.goalWeight}kg · ${Math.max(0,Math.round((latestWeight()-S.profile.goalWeight)*10)/10)}kg to go</p>`:""}
      </div>
    </section>
    <section class="section"><h2>Session history</h2>
      ${hist.length?`<ul class="card hist">${hist.map(h=>`<li><span><b>${esc(h.name)}</b><br><span class="muted" style="font-size:13px">${esc(histSummary(h))}</span></span><span class="when">${fmtDate(h.date)}</span></li>`).join("")}</ul>`
        :`<div class="empty">Your finished sessions will show here.</div>`}
    </section>
    <section class="section">${inviteCard(2,false)}</section>`);
  $("#wform").addEventListener("submit",e=>{
    e.preventDefault(); const kg=parseFloat($("#wkg").value); if(!kg) return;
    const t=today(), ex=S.weights.find(x=>x.date===t);
    if(ex) ex.kg=kg; else S.weights.push({date:t,kg});
    save(); render(); toast("Weight logged");
  });
}
function histSummary(h){
  const s=SESSIONS[h.sessKey];
  if(h.type==="lift" && s){
    const first=h.data?.sets?.[0]||[]; const best=first.filter(x=>x&&x.kg).sort((a,b)=>parseFloat(b.kg)-parseFloat(a.kg))[0];
    return best?`${s.exercises[0].name}: ${best.kg}kg x ${best.reps||"?"}`:`Week ${h.week+1}`;
  }
  if(h.type==="circuit"){ const r=(h.data.rounds||[]).filter(Boolean).length; return `${r} rounds${h.data.time?" · "+h.data.time:""}`; }
  return [h.data?.dist?h.data.dist+"km":"", h.data?.time||""].filter(Boolean).join(" · ") || `Week ${h.week+1}`;
}
function chartSvg(w){
  const W=480,H=180,pl=40,pr=14,pt=14,pb=26;
  const ks=w.map(x=>x.kg), min=Math.floor(Math.min(...ks)-1), max=Math.ceil(Math.max(...ks)+1);
  const x=i=>pl+(W-pl-pr)*(w.length===1?0:i/(w.length-1)), y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min));
  const pts=w.map((p,i)=>`${x(i)},${y(p.kg)}`).join(" ");
  const ticks=[min,(min+max)/2,max].map(v=>Math.round(v*10)/10);
  const last=w[w.length-1];
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight from ${w[0].kg}kg to ${last.kg}kg">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" fill="var(--muted)" font-size="11" text-anchor="end">${v}</text>`).join("")}
    <polygon points="${pl},${H-pb} ${pts} ${x(w.length-1)},${H-pb}" fill="var(--cyan)" fill-opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--cyan)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(w.length-1)}" cy="${y(last.kg)}" r="5" fill="var(--pink)"/>
    <text x="${pl}" y="${H-6}" fill="var(--muted)" font-size="11">${fmtDate(w[0].date)}</text>
    <text x="${W-pr}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="end">${fmtDate(last.date)}</text>
  </svg></div>`;
}

/* ---------------- Boot ---------------- */
(function(){
  const h=(location.hash||"").slice(1);
  if(h && !S.unlocked && tryCode(h)){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  render();
})();
</script>
